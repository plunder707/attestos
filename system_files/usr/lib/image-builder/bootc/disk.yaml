mount_configuration: "units"
partition_table:
  type: "gpt"
  partitions:
    - size: "1 MiB"
      type: "21686148-6449-6e6f-744e-656564454649"
      bootable: true
    - size: "501 MiB"
      type: "c12a7328-f81f-11d2-ba4b-00a0c93ec93b"
      payload_type: "filesystem"
      payload:
        type: "vfat"
        mountpoint: "/boot/efi"
        label: "EFI-SYSTEM"
        fstab_options: "defaults,uid=0,gid=0,umask=077,shortname=winnt"
        fstab_freq: 0
        fstab_passno: 2
    - size: "1 GiB"
      type: "0fc63daf-8483-4772-8e79-3d69d8477de4"
      payload_type: "filesystem"
      payload:
        type: "ext4"
        mountpoint: "/boot"
        label: "boot"
        fstab_options: "defaults"
        fstab_freq: 0
        fstab_passno: 0
    - size: "20 GiB"
      type: "4f68bce3-e8cd-4db1-96e7-fbcaf984b709"
      payload_type: "filesystem"
      payload:
        type: "ext4"
        mountpoint: "/"
        label: "root"
        fstab_options: "defaults"
        fstab_freq: 0
        fstab_passno: 0
