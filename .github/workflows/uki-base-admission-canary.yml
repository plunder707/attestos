---
name: UKI base admission canary

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'Containerfile'
      - 'Containerfile.boot-canary'
      - 'build_files/**'
      - 'system_files/**'
      - 'disk_config/disk.toml'
      - 'scripts/inspect_uki_candidate.py'
      - 'scripts/run_booted_image_canary.sh'
      - 'scripts/validate_booted_image_receipt.py'
      - 'scripts/validate_uki_admission.py'
      - 'tests/**'
      - 'UKI_ADMISSION_CANARY.md'
      - '.github/workflows/uki-base-admission-canary.yml'

permissions:
  contents: read

concurrency:
  group: uki-base-admission-${{ github.ref }}
  cancel-in-progress: true

env:
  ATTESTOS_BASE_IMAGE: ghcr.io/projectbluefin/bluefin:lts
  ATTESTOS_BUILDER_IMAGE: quay.io/centos-bootc/bootc-image-builder@sha256:2b52843ea2bfda73b0a08d97e76b734393b1d3a804681b9fabb26723bd3a2f0b
  ATTESTOS_BLUEFIN_SIGNER_IDENTITY: https://github.com/projectbluefin/bluefin-lts/.github/workflows/reusable-build-image.yml@refs/heads/lts

jobs:
  uki-admission:
    name: Bluefin LTS signed UKI admission
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Maximize disposable runner space
        uses: ublue-os/remove-unwanted-software@cc0becac701cf642c8f0a6613bbdaf5dc36b259e # v9
        with:
          remove-codeql: true

      - name: Install canary dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils \
            jq \
            openssl \
            ovmf \
            podman \
            python3-pytest \
            python3-yaml \
            qemu-system-x86 \
            sbsigntool \
            skopeo \
            swtpm \
            swtpm-tools \
            tpm2-tools

      - name: Validate canary contracts
        run: python3 -m pytest -q

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.2

      - name: Resolve and verify immutable Bluefin LTS base
        id: base
        run: |
          set -euo pipefail

          repository="${ATTESTOS_BASE_IMAGE%:*}"
          index_digest=$(skopeo inspect --format '{{.Digest}}' \
            "docker://$ATTESTOS_BASE_IMAGE")
          [[ "$index_digest" == sha256:* ]]
          index_reference="${repository}@${index_digest}"

          skopeo inspect --raw "docker://${index_reference}" > canary-base-index.json
          computed_index_digest="sha256:$(sha256sum canary-base-index.json | cut -d' ' -f1)"
          [[ "$computed_index_digest" == "$index_digest" ]]
          jq -e '
            .mediaType == "application/vnd.oci.image.index.v1+json"
            or .mediaType == "application/vnd.docker.distribution.manifest.list.v2+json"
          ' canary-base-index.json >/dev/null

          cosign verify \
            --certificate-identity "$ATTESTOS_BLUEFIN_SIGNER_IDENTITY" \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            "$index_reference" > canary-base-signature.json

          amd64_digest=$(jq -er '
            [
              .manifests[]
              | select(
                  .platform.os == "linux"
                  and .platform.architecture == "amd64"
                  and ((.platform.variant // "") == "")
                )
            ]
            | if length == 1 then .[0].digest
              else error("expected exactly one linux/amd64 child manifest")
              end
          ' canary-base-index.json)
          [[ "$amd64_digest" == sha256:* ]]
          reference="${repository}@${amd64_digest}"
          skopeo inspect --raw "docker://${reference}" > canary-base-amd64-manifest.json
          computed_amd64_digest="sha256:$(sha256sum canary-base-amd64-manifest.json | cut -d' ' -f1)"
          [[ "$computed_amd64_digest" == "$amd64_digest" ]]

          jq -n \
            --arg source_tag "$ATTESTOS_BASE_IMAGE" \
            --arg signed_index_reference "$index_reference" \
            --arg signer_identity "$ATTESTOS_BLUEFIN_SIGNER_IDENTITY" \
            --arg oidc_issuer 'https://token.actions.githubusercontent.com' \
            --arg amd64_child_reference "$reference" \
            '{
              format: "attestos.oci_base_provenance/v1",
              source_tag: $source_tag,
              signed_index_reference: $signed_index_reference,
              signer_identity: $signer_identity,
              oidc_issuer: $oidc_issuer,
              selected_platform: {os: "linux", architecture: "amd64"},
              amd64_child_reference: $amd64_child_reference
            }' > canary-base-provenance.json

          echo "reference=$reference" >> "$GITHUB_OUTPUT"
          echo "index_reference=$index_reference" >> "$GITHUB_OUTPUT"
          echo "ATTESTOS_BASE_REFERENCE=$reference" >> "$GITHUB_ENV"

      - name: Build candidate and canary derivative
        run: |
          set -euxo pipefail
          sudo podman build \
            --pull=always \
            --build-arg "BASE_IMAGE=${{ steps.base.outputs.reference }}" \
            --build-arg "ATTESTOS_SOURCE_COMMIT=$GITHUB_SHA" \
            --tag localhost/attestos:uki-candidate-base \
            --file Containerfile \
            .
          sudo podman build \
            --pull=never \
            --build-arg BASE_IMAGE=localhost/attestos:uki-candidate-base \
            --tag localhost/attestos:uki-candidate \
            --file Containerfile.boot-canary \
            .

      - name: Inspect UKI candidates and tamper negative
        run: |
          set -euxo pipefail
          mkdir -p uki-output
          sudo python3 scripts/inspect_uki_candidate.py \
            --image localhost/attestos:uki-candidate \
            --output uki-output/static-inspection.json

          sudo podman run \
            --rm \
            --entrypoint /usr/bin/cat \
            localhost/attestos:uki-candidate \
            /usr/lib/image-builder/bootc/disk.yaml \
            > uki-output/disk-layout.yaml
          cmp \
            system_files/usr/lib/image-builder/bootc/disk.yaml \
            uki-output/disk-layout.yaml

      - name: Build QCOW2 without publishing
        run: |
          set -euxo pipefail
          mkdir -p output
          sudo podman run \
            --rm \
            --privileged \
            --pull=always \
            --net=host \
            --security-opt label=type:unconfined_t \
            -v "$PWD/disk_config/disk.toml:/config.toml:ro" \
            -v "$PWD/output:/output" \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            "$ATTESTOS_BUILDER_IMAGE" \
            --type qcow2 \
            --use-librepo=True \
            --rootfs=ext4 \
            localhost/attestos:uki-candidate
          test -s output/qcow2/disk.qcow2
          sudo chown -R "$(id -u):$(id -g)" output

      - name: Boot with OVMF Secure Boot and collect evidence
        env:
          ATTESTOS_BASE_REFERENCE: ${{ steps.base.outputs.reference }}
          ATTESTOS_BUILDER_REFERENCE: ${{ env.ATTESTOS_BUILDER_IMAGE }}
          ATTESTOS_SECURE_BOOT: enforce
        run: |
          set -euxo pipefail
          bash scripts/run_booted_image_canary.sh \
            output/qcow2/disk.qcow2 \
            uki-output

      - name: Evaluate admission gates
        run: |
          set -euxo pipefail
          python3 scripts/validate_uki_admission.py \
            --receipt uki-output/receipt.json \
            --static-inspection uki-output/static-inspection.json \
            --output uki-output/admission.json

      - name: Publish bounded audit artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: uki-base-admission-${{ github.sha }}
          path: |
            canary-base-signature.json
            canary-base-index.json
            canary-base-amd64-manifest.json
            canary-base-provenance.json
            uki-output/disk-layout.yaml
            uki-output/static-inspection.json
            uki-output/receipt.json
            uki-output/admission.json
            uki-output/serial.log
          if-no-files-found: warn
          retention-days: 14
          compression-level: 9

      - name: Enforce admission stop rules
        run: |
          set -euo pipefail
          python3 scripts/validate_uki_admission.py \
            --receipt uki-output/receipt.json \
            --static-inspection uki-output/static-inspection.json \
            --output uki-output/admission.json \
            --enforce
